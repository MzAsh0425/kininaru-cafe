name: Deploy Supabase

# supabase/ 以下を変更して push したとき、または Actions 画面から手動実行したときに
# DB マイグレーションと Edge Function をデプロイする。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Supabase のシークレットが未設定のためスキップします（README 参照）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        if: steps.check.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Set function secrets
        if: steps.check.outputs.ready == 'true' && env.ANTHROPIC_API_KEY != ''
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"

      - name: Deploy edge function
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy process-cafe --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
